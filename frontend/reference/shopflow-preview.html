.receipt{font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.14);border-radius:10px;padding:14px 16px;max-width:300px}
.receipt div{display:flex;justify-content:space-between}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}

.ic{border:1px solid var(--bd);border-radius:8px;font-size:15px}
.card{width:100%;max-width:460px;margin:auto;padding:8px 24px 40px}
.wide{max-width:600px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.sub{color:var(--mu);margin:0 0 24px}
.f{display:block;margin-bottom:16px}
.f span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.f em{display:block;color:var(--er);font-size:13px;font-style:normal;margin-top:4px}
.f.bad input{border-color:var(--er)}
.btn{width:100%;min-height:48px;border:0;border-radius:8px;background:var(--ac);color:var(--on);font:700 16px inherit;cursor:pointer}
.btn:hover{background:var(--ac2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:12px}.row>*{flex:1}
.lnk{background:none;border:0;color:var(--ac);font:600 14px inherit;cursor:pointer;padding:6px 0}
.alt{text-align:center;color:var(--mu);margin-top:18px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;background:var(--sf);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:16px;cursor:pointer;font:inherit;min-height:48px}
.mode b{display:block;margin-bottom:4px}.mode small{color:var(--mu);font-size:13px;line-height:1.4;display:block}
.mode[aria-pressed="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--sf))}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--bd)}.steps i.on{background:var(--ac)}
.stl{color:var(--mu);font-size:13px;margin-bottom:6px}
.nav{display:flex;gap:12px;margin-top:8px}.nav .btn{flex:1}.nav .ghost{flex:0 0 38%}
.sum{border:1px solid var(--bd);border-radius:10px;background:var(--sf);margin-bottom:20px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd);font-size:14px}
.sum div:last-child{border:0}.sum span{color:var(--mu)}
.note{font-size:13px;color:var(--mu);background:var(--sf);border:1px dashed var(--bd);border-radius:8px;padding:10px 12px;margin-top:20px}
.ok{color:var(--ok);font-weight:600}
@media (max-width:800px){.shell{grid-template-columns:1fr}aside{display:none}.card{padding:8px 18px 32px}.grid2{grid-template-columns:1fr}.row{flex-direction:column;gap:0}}

.hero{position:absolute;inset:0;background:linear-gradient(135deg,#0f3a42 0%,#1d7f8c 55%,#35b5c3 100%);clip-path:polygon(34% 0,100% 0,100% 100%,0 100%);display:flex;align-items:center;justify-content:flex-end;padding-right:8%;text-align:right}

.fm{position:relative;z-index:1;width:46%;padding:48px 40px}.rev .fm{margin-left:auto}
.frame .card{margin:0;padding:0;max-width:none}
.frame h1{text-align:center;font-size:30px;color:#e9fbfd}
.frame .sub{text-align:center}
.frame .f{position:relative}
.frame .f input{background:transparent;border:0;border-bottom:1.5px solid #8fb2b8;border-radius:0;padding:8px 30px 8px 0;color:#fff}

sc_ph:["Picha ya bidhaa","Product photo"],sc_note:["Picha hupunguzwa ukubwa na kuhifadhiwa kwenye kivinjari (IndexedDB).","Photos are resized and stored in the browser (IndexedDB)."],sc_nostock:["Stoo haitoshi","Not enough stock"],sc_reset:["Futa orodha iliyohifadhiwa","Clear saved catalog"],sc_rd:["Imefutwa. Pakia ukurasa upya.","Cleared. Reload the page."]};
for(const k in L9){T.sw[k]=L9[k][0];T.en[k]=L9[k][1]}
const SC={stream:null,timer:0,reader:null,mode:'',idx:0,last:'',lt:0};
const zx=()=>window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const scm=m=>{const e=$('#scm');if(e)e.textContent=m};
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},120)}catch(e){}try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function scanStop(){clearInterval(SC.timer);try{SC.reader&&SC.reader.reset()}catch(e){}SC.reader=null;if(SC.stream)SC.stream.getTracks().forEach(x=>x.stop());SC.stream=null;const o=$('#scan');if(o){o.style.display='none';o.innerHTML=''}}
function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res('');im.src=u})}
async function scanOpen(mode,idx){scanStop();Object.assign(SC,{mode,idx:+idx||0,last:'',lt:0});let o=$('#scan');if(!o){o=document.createElement('div');o.id='scan';o.className='rov';document.body.appendChild(o)}
 const ph=mode==='photo';o.innerHTML=`<div class="rcp scp" role="dialog" aria-label="${t(ph?'sc_photo':'sc_title')}"><h3 style="margin:0 0 8px">${t(ph?'sc_photo':'sc_title')}</h3><div class="vw"><video id="scv" playsinline muted></video>${ph?'':'<div class="ln"></div>'}</div><p id="scm" class="sub" style="margin:8px 0">${t('sc_loading')}</p><div id="scl" style="max-height:90px;overflow:auto"></div>
 <div class="row" style="gap:8px">${ph?`<button class="btn" id="scc" disabled>${t('sc_cap')}</button>`:''}<label class="btn ghost" id="scf" style="display:none;text-align:center;line-height:48px;cursor:pointer">${t(ph?'sc_gal':'sc_fromph')}<input type="file" accept="image/*" ${ph?'':'capture="environment"'} hidden></label><button class="btn ghost" id="scx">${t('sc_close')}</button></div></div>`;
 o.style.display='grid';$('#scx').onclick=scanStop;const fi=$('#scf input');fi.onchange=()=>fromFile(fi.files[0]);
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('#scv');if(!v){scanStop();return}v.srcObject=SC.stream;await v.play()}catch(e){scm(t('sc_denied'));const f=$('#scf');if(f)f.style.display='block';return}
 if(ph){const c=$('#scc');if(!c)return;c.disabled=false;scm('');c.onclick=()=>{const v=$('#scv'),cv=document.createElement('canvas'),r=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));cv.width=Math.round(v.videoWidth*r);cv.height=Math.round(v.videoHeight*r);cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);S.pf.img=cv.toDataURL('image/jpeg',.72);scanStop();render()};return}
 scm(t('sc_aim'));
 if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});SC.timer=setInterval(async()=>{try{const v=$('#scv');if(!v)return;const r=await d.detect(v);if(r[0])onScan(r[0].rawValue)}catch(e){}},250)}
 else{try{scm(t('sc_loading'));await zx();SC.reader=new ZXing.BrowserMultiFormatReader();scm(t('sc_aim'));SC.reader.decodeFromStream(SC.stream,$('#scv'),r=>{if(r)onScan(r.getText())})}catch(e){scm(t('sc_nosup'));const f=$('#scf');if(f)f.style.display='block'}}}
async function fromFile(file){if(!file)return;if(SC.mode==='photo'){S.pf.img=await shrink(file);scanStop();render();return}
 scm(t('sc_loading'));let code='';try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(await createImageBitmap(file));code=r[0]&&r[0].rawValue}else{await zx();const u=URL.createObjectURL(file),r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(u);code=r.getText()}}catch(e){}
 code?onScan(code,true):scm(t('sc_nodet'))}
function onScan(code,once){const n=Date.now();if(code===SC.last&&n-SC.lt<1500)return;SC.last=code;SC.lt=n;beep();
 if(SC.mode==='form'){if(S.pf)S.pf.vs[SC.idx].bc=code;scanStop();render();toast(code);return}
 const r=allRows().find(x=>x.v.bc===code),l=$('#scl');
 if(r){const b=S.cart.reduce((a,x)=>a+x.q,0);addCart(r.v.id);const ok=S.cart.reduce((a,x)=>a+x.q,0)>b;if(l)l.insertAdjacentHTML('afterbegin',`<div class="rl"><span>${ok?'✓':'✕'} ${esc((r.p.n+' '+r.v.l).trim())}</span><span>${ok?tz2(r.v.sell):t('sc_nostock')}</span></div>`);S.unk=''}
 else{S.unk=code;render();scm(t('x_unk')+' '+code)}
 if(once)scanStop()}
const photoBlock=()=>`<div class="f"><span>${t('sc_ph')}</span><div class="ph2">${S.pf.img?`<img src="${S.pf.img}" class="pv" alt="">`:`<div class="pv e">📷</div>`}<div class="pcs"><button type="button" class="btn ghost au" data-a="phcam">📷 ${t('sc_photo')}</button><label class="btn ghost au" style="line-height:48px;cursor:pointer">${t('sc_gal')}<input type="file" accept="image/*" hidden data-ph></label>${S.pf.img?`<button type="button" class="lnk" data-a="phrm">${t('sc_rm')}</button>`:''}</div></div><small style="color:var(--mu)">${t('sc_note')}</small></div>`;
let ct=0;const saveCat=()=>{clearTimeout(ct);ct=setTimeout(()=>idb(s=>s.put(JSON.stringify({prods:S.prods,cats:S.cats}),'cat')),600)};
const loadCat=()=>idb((s,res)=>{const g=s.get('cat');g.onsuccess=()=>{try{const d=JSON.parse(g.result||'null');if(d&&d.prods&&d.cats){S.prods=d.prods;S.cats=d.cats}}catch(e){}res()}});
const _r10=render;render=function(){_r10();if(S.view==='app')saveCat()};
const _sy=PG.sync;PG.sync=()=>_sy().replace(/<\/div>$/,`<button class="btn ghost au" data-a="rstcat">${t('sc_reset')}</button></div>`);
document.addEventListener('change',async e=>{const el=e.target;if(el.hasAttribute('data-ph')&&el.files[0]&&S.pf){S.pf.img=await shrink(el.files[0]);render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='scan')scanOpen('pos');else if(a==='scanf')scanOpen('form',v);else if(a==='phcam')scanOpen('photo');else if(a==='phrm'){S.pf.img='';render()}
 else if(a==='rstcat')idb(s=>s.delete('cat')).then(()=>toast(t('sc_rd')));
 if(a==='nav'||a==='back2')scanStop()});
loadCat().then(()=>{if(S.view==='app')render()});
</script>
<script>
Object.assign(T.sw,{rs_title:"Ongeza mzigo mpya",rs_qty:"Idadi iliyoletwa",rs_cur:"Stoo ya sasa",rs_after:"Stoo baada ya kuongeza",rs_buy:"Bei ya kununua (si lazima kubadili)",rs_sell:"Bei ya kuuza (si lazima kubadili)",rs_more:"Hariri maelezo mengine",rs_btn:"+ Mzigo",rs_ok:"Mzigo umeongezwa",m_restock:"Mzigo mpya"});
Object.assign(T.en,{rs_title:"Receive new stock",rs_qty:"Quantity received",rs_cur:"Current stock",rs_after:"Stock after adding",rs_buy:"Purchase price (change only if needed)",rs_sell:"Selling price (change only if needed)",rs_more:"Edit other details",rs_btn:"+ Stock",rs_ok:"Stock added",m_restock:"New stock"});
S.rsn=0;
const rsB=v=>(can2('inventory')||can2('catalog'))?`<button class="lnk" data-a="rst" data-v="${v.id}" aria-label="${t('rs_title')}">${t('rs_btn')}</button>`:'';
function rsClose(){const o=$('#rsd');if(o){o.style.display='none';o.innerHTML=''}}
function rsOpen(vid){const r=allRows().find(x=>x.v.id==vid);if(!r||!(can2('inventory')||can2('catalog')))return;let o=$('#rsd');if(!o){o=document.createElement('div');o.id='rsd';o.className='rov';document.body.appendChild(o)}
 const v=r.v,nm=(r.p.n+' '+v.l).trim();
 o.innerHTML=`<div class="rcp" style="font-family:inherit;width:min(420px,100%)" role="dialog" aria-label="${t('rs_title')}"><h3 style="margin:0 0 4px">${t('rs_title')}</h3><p class="sub" style="margin:0 0 12px"><b>${esc(nm)}</b> · ${t('rs_cur')}: <b>${v.st}</b></p>
 <label class="f"><span>${t('rs_qty')}</span><input id="rsq" type="number" min="1" inputmode="numeric"></label><p id="rsa" class="sub" style="margin:-8px 0 12px"></p>
 <div class="row"><label class="f"><span>${t('rs_buy')}</span><input id="rsb" type="number" min="0" value="${v.buy}"></label><label class="f"><span>${t('rs_sell')}</span><input id="rss" type="number" min="0" value="${v.sell}"></label></div><p id="rse" style="color:var(--er);margin:0 0 8px"></p>
 <div class="row" style="gap:8px"><button class="btn ghost" id="rsx">${t('p_cancel')}</button><button class="btn" id="rsv">${t('p_save')}</button></div><button class="lnk" id="rsm" style="margin-top:8px">${t('rs_more')}</button></div>`;
 o.style.display='grid';const q=$('#rsq');q.focus();
 q.oninput=()=>{$('#rsa').textContent=+q.value>0?`${t('rs_after')}: ${v.st+parseInt(q.value,10)}`:''};
 $('#rsx').onclick=rsClose;$('#rsm').onclick=()=>{rsClose();S.page='products';S.pf=JSON.parse(JSON.stringify(r.p));S.pe={};render()};
 $('#rsv').onclick=async()=>{const n=parseInt(q.value,10),b=$('#rsb').value,s=$('#rss').value,er=$('#rse');
  if(!(n>0)||!(+s>0)||b===''||+b<0){er.textContent=t('p_pos');return}
  $('#rsv').disabled=true;$('#rsv').textContent=t('wait');await mock(600);
  v.st+=n;if(+b!==v.buy)v.buy=+b;if(+s!==v.sell)v.sell=+s;S.rsn++;
  S.mov.unshift({d:nowD(),p:nm,t:'restock',q:n,r:'RST-'+String(S.rsn).padStart(4,'0'),u:S.d.name||'Owner'});
  rsClose();toast(t('rs_ok')+': +'+n);render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='rst')rsOpen(b.dataset.v);if(b.dataset.a==='nav')rsClose()});
